name: Library checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  framebuffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/native/run.sh
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [uno, countdown, esp8266, esp32core2, esp32core3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -d tests/compile -e ${{ matrix.environment }}
