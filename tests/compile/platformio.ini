[env]
framework = arduino
build_src_filter = -<*> +<main.cpp>
lib_deps = symlink://../..

[env:uno]
platform = atmelavr@5.1.0
board = uno

[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e

[env:esp32core2]
platform = espressif32@6.12.0
board = esp32dev

[env:esp32core3]
platform = espressif32@8.0.0
board = esp32dev

[env:countdown]
platform = atmelavr@5.1.0
board = uno
build_src_filter = -<*> +<countdown.cpp>
